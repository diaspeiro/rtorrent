name: Check dependencies for updates

on:
  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight UTC
  workflow_dispatch:

jobs:
  check-dependencies:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: diaspeiro/actions/duck@7be61b1cf3d462fc7d56de1704b3f48eb0b16b67
